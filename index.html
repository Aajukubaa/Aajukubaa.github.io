<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Pro Portfolio</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: var(--bg); color: var(--text); }
        header { background: var(--primary); color: white; padding: 3rem 1rem; text-align: center; }
        .container { max-width: 800px; margin: -2rem auto 2rem auto; padding: 0 1rem; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; transition: 0.2s;}
        button:hover { background: #1d4ed8; transform: translateY(-2px); }
        #display-area { margin-top: 25px; padding: 20px; background: #f1f5f9; border-left: 5px solid var(--primary); border-radius: 0 8px 8px 0; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Portfolio</h1>
        <p>Interactive, fast, and powered entirely by Python.</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>My Projects</h2>
            <p>Click the buttons below to load my projects dynamically using Python:</p>
            
            <button py-click="load_project_1">Project 1</button>
            <button py-click="load_project_2">Project 2</button>
            <button py-click="load_project_3">Project 3</button>
            
            <div id="display-area">
                <em>Select a project above to see details...</em>
            </div>
        </div>
    </div>

    <script type="py" src="./main.py"></script>
</body>
</html>
