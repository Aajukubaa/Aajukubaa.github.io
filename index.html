<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kabir Bhuchar | Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        /* 1. Base Setup & Background */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 2. The Glowing Cursor Blob */
        #blob {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            height: 400px;
            aspect-ratio: 1;
            position: fixed;
            left: 50%;
            top: 50%;
            translate: -50% -50%;
            border-radius: 50%;
            animation: spin 10s infinite linear;
            opacity: 0.6;
            z-index: -2;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 3. The Blur Layer (Creates the deep, frosted effect) */
        #blur-layer {
            height: 100vh;
            width: 100vw;
            position: fixed;
            z-index: -1;
            backdrop-filter: blur(150px);
        }

        /* 4. Main Content Layout */
        .container {
            max-width: 800px;
            width: 90%;
            margin-top: 50px;
            z-index: 1;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 5. Modern Glass Buttons */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #8b5cf6;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        /* 6. The Glassmorphism Content Card */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            min-height: 300px;
        }

        /* Styling for the Python-generated content */
        .activity-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            border-left: 4px solid #8b5cf6;
            transition: transform 0.2s;
        }
        .activity-item:hover {
            transform: translateX(10px);
            background: rgba(255, 255, 255, 0.06);
        }
        a { color: #8b5cf6; text-decoration: none; font-weight: 600; }
        a:hover { color: #a78bfa; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="blob"></div>
    <div id="blur-layer"></div>

    <div class="container">
        <header>
            <h1>Kabir Bhuchar</h1>
            <p style="color: #94a3b8; letter-spacing: 2px;">STUDENT | ATHLETE | DEVELOPER</p>
        </header>

        <div class="nav-bar">
            <button class="nav-btn" py-click="show_home">Home</button>
            <button class="nav-btn" py-click="show_links">My Links</button>
            <button class="nav-btn" py-click="show_activities">Activities</button>
        </div>

        <div class="card" id="content-area">
            <div style="text-align: center; color: #94a3b8;">
                <p>Initializing Python Engine...</p>
            </div>
        </div>
    </div>

    <script type="py">
        from pyscript import document

        # Notice how I added CSS classes to your HTML inside the Python dictionary 
        # to make it match the new premium theme!
        pages = {
            "home": """
                <h2 style="margin-top: 0;">Welcome to My World</h2>
                <p style="color: #cbd5e1; line-height: 1.6;">I am a student from India, currently living in London. I balance my time between competitive sports, strategic board games, and writing code.</p>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px;">
                    <div class="activity-item" style="border-left-color: #3b82f6;">
                        <h3 style="margin: 0 0 10px 0;">♞ Chess</h3>
                        <p style="margin: 0; color: #94a3b8;">1545 FIDE Rating</p>
                    </div>
                    <div class="activity-item" style="border-left-color: #f59e0b;">
                        <h3 style="margin: 0 0 10px 0;">🏀 Basketball</h3>
                        <p style="margin: 0; color: #94a3b8;">6'0" Center</p>
                    </div>
                    <div class="activity-item" style="border-left-color: #10b981;">
                        <h3 style="margin: 0 0 10px 0;">🎻 Music</h3>
                        <p style="margin: 0; color: #94a3b8;">Violin (Suzuki Bk 3)</p>
                    </div>
                </div>
            """,
            "links": """
                <h2 style="margin-top: 0;">Connect With Me</h2>
                <div class="activity-item"><a href="http://ratings.fide.com/profile/498777" target="_blank">♟️ FIDE Profile (1545)</a></div>
                <div class="activity-item"><a href="http://chess.com/member/aajukubaa" target="_blank">♞ Chess.com Profile</a></div>
                <div class="activity-item"><a href="https://github.com/Aajukubaaa" target="_blank">💻 GitHub Repository</a></div>
                <div class="activity-item"><a href="https://www.youtube.com/@Aajukubaa" target="_blank">▶️ YouTube Channel</a></div>
            """,
            "activities": """
                <h2 style="margin-top: 0;">Extracurricular Activities</h2>
                <p style="color: #cbd5e1;">Highlights of my achievements outside the classroom:</p>
                <div class="activity-item">
                    <h3 style="margin-top: 0;">🏀 Basketball Tournaments</h3>
                    <p style="color: #94a3b8;">Playing competitive matches as a 6'0" Center, focusing on team coordination, defense, and high-pressure tournament performance.</p>
                </div>
                <div class="activity-item">
                    <h3 style="margin-top: 0;">♟️ Chess Competitions</h3>
                    <p style="color: #94a3b8;">Active competitive player maintaining a 1545 FIDE rating, analyzing complex openings, and playing strategic tournament games.</p>
                </div>
                <div class="activity-item">
                    <h3 style="margin-top: 0;">💻 Coding & Development</h3>
                    <p style="color: #94a3b8;">Building automated Python scripts, web applications, and deploying custom static pages directly to GitHub Pages.</p>
                </div>
            """
        }

        def update_page(content):
            content_box = document.querySelector("#content-area")
            content_box.innerHTML = content

        def show_home(event): update_page(pages["home"])
        def show_links(event): update_page(pages["links"])
        def show_activities(event): update_page(pages["activities"])

        # Load home page on start
        update_page(pages["home"])
    </script>

    <script>
        const blob = document.getElementById("blob");
        window.onpointermove = event => { 
            const { clientX, clientY } = event;
            blob.animate({ left: `${clientX}px`, top: `${clientY}px` }, { duration: 3000, fill: "forwards" });
        }
    </script>
</body>
</html>
