<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabir Bhuchar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0;
            background-color: #000000;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        /* Touch Device & Cursor Handling */
        @media (pointer: fine) {
            body, html { cursor: none; }
            a, button, .pro-card, .connect-card { cursor: none !important; }
            #custom-cursor { display: block; }
        }
        @media (pointer: coarse) {
            #custom-cursor { display: none !important; }
        }

        #custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 26px; height: 26px;
            background-color: #ffffff;
            border-radius: 50%;
            mix-blend-mode: difference;
            pointer-events: none;
            z-index: 99999;
            will-change: transform;
            transition: transform 0.05s ease-out;
        }

        /* PyScript Loading Splash Screen */
        #pyscript-loader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #pyscript-loader.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .kabir-cursive {
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.35);
            display: inline-block;
            padding: 0 2px;
        }

        /* Enhanced Card Press Animation */
        @keyframes pressAnim {
            0% { transform: scale(1); }
            30% { transform: scale(0.92); filter: brightness(1.2); }
            100% { transform: scale(1); }
        }
        .card-pressed { animation: pressAnim 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
