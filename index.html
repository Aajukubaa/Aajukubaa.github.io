<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabir Bhuchar | Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        /* Base Setup: Fully Black Background & Clean Performance */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: flex-end;
            gap: 2rem;
            padding: 2rem 4rem;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav a {
            color: #888888;
            text-decoration: none;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Hero Section: Large Typography Filling the Screen */
        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size.clamp: 10vw;
            font-size: clamp(4rem, 12vw, 13rem);
            font-weight: 800;
            line-height: 0.9;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: -0.03em;
        }

        .hero-title span {
            display: block;
        }

        /* Content Area controlled by PyScript */
        #content-area {
            padding: 0 4rem 4rem 4rem;
        }
    </style>
</head>
<body>

    <nav>
        <a py-click="show_home">Home</a>
        <a py-click="show_links">Links</a>
        <a py-click="show_activities">Activities</a>
    </nav>

    <main class="hero-container">
        <h1 class="hero-title">
            <span>Kabir</span>
            <span>Bhuchar</span>
        </h1>
    </main>

    <div id="content-area"></div>

    <script type="py" config='{"packages": []}'>
        from pyscript import document

        pages = {
            "home": "",
            "links": """
                <div style="border-top: 1px solid #222; padding-top: 2rem;">
                    <h2>Links</h2>
                    <p style="color: #888;">Explore my external profiles and projects.</p>
                </div>
            """,
            "activities": """
                <div style="border-top: 1px solid #222; padding-top: 2rem;">
                    <h2>Activities</h2>
                    <p style="color: #888;">Chess, Coding, and F1 enthusiast.</p>
                </div>
            """
        }

        def update_page(content):
            content_box = document.querySelector("#content-area")
            content_box.innerHTML = content

        def show_home(event): update_page(pages["home"])
        def show_links(event): update_page(pages["links"])
        def show_activities(event): update_page(pages["activities"])
    </script>

</body>
</html>
