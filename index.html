<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kabir | Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        /* 1. BASE SETUP & CUSTOM CURSOR */
        body, html {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            cursor: none; /* Hides the default mouse */
        }

        /* The Inverted Color Cursor Magic */
        #custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 40px; height: 40px;
            border-radius: 50%;
            background-color: #fff;
            mix-blend-mode: difference; /* This automatically inverts colors! */
            pointer-events: none; /* Lets you click through it */
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }

        /* 2. NIKE-STYLE HERO SECTION */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 24vw; /* Scales to fill the screen perfectly */
            margin: 0;
            line-height: 0.8;
            letter-spacing: -0.05em;
        }

        /* 3. APPLE-STYLE VIBRANT COLUMNS */
        .columns-container {
            height: 100vh;
            display: flex;
            width: 100%;
        }
        .column {
            flex: 1; /* Makes them equal width */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: flex 0.5s cubic-bezier(0.25, 1, 0.5, 1); /* Smooth expansion */
            color: #000;
            position: relative;
        }
        /* The Apple Expansion Effect */
        .column:hover {
            flex: 1.5; 
        }
        .column h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 4vw;
            text-transform: uppercase;
            transform: rotate(-90deg);
            transition: transform 0.4s;
            white-space: nowrap;
        }
        .column:hover h2 {
            transform: rotate(0deg) scale(1.2);
        }

        /* Vibrant Solid Colors */
        #chess { background-color: #FF3366; } /* Vibrant Pink/Red */
        #basketball { background-color: #FF9933; } /* Vibrant Orange */
        #coding { background-color: #33CCFF; } /* Vibrant Blue */
        #music { background-color: #CC33FF; } /* Vibrant Purple */

        /* 4. SOCIAL LINKS SECTION */
        .socials {
            padding: 100px 20px;
            background: #000;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .socials a {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #fff;
            padding: 15px 40px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .socials a:hover {
            background: #fff;
            color: #000;
        }

        /* 5. DYNAMIC DETAIL PAGE (Controlled by Python) */
        #detail-view {
            display: none; /* Hidden by default */
            min-height: 100vh;
            width: 100%;
            padding: 80px 10vw;
            box-sizing: border-box;
            color: #000;
        }
        .back-btn {
            background: transparent;
            border: 3px solid #000;
            color: #000;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 50px;
            font-family: 'Poppins', sans-serif;
        }
        .back-btn:hover { background: #000; color: #fff; }
        #detail-title { font-family: 'Montserrat', sans-serif; font-size: 6rem; margin: 0 0 20px 0; text-transform: uppercase;}
        #detail-content { font-size: 1.5rem; line-height: 1.6; max-width: 800px; }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <div id="main-view">
        
        <section class="hero">
            <h1>KABIR</h1>
        </section>

        <section class="columns-container">
            <div class="column" id="chess" py-click="open_category">
                <h2>Chess</h2>
            </div>
            <div class="column" id="basketball" py-click="open_category">
                <h2>Basketball</h2>
            </div>
            <div class="column" id="coding" py-click="open_category">
                <h2>Coding</h2>
            </div>
            <div class="column" id="music" py-click="open_category">
                <h2>Music</h2>
            </div>
        </section>

        <section class="socials">
            <a href="http://ratings.fide.com/profile/498777" target="_blank">FIDE</a>
            <a href="https://github.com/Aajukubaaa" target="_blank">GitHub</a>
            <a href="https://www.youtube.com/@Aajukubaa" target="_blank">YouTube</a>
        </section>

    </div>

    <div id="detail-view">
        <button class="back-btn" py-click="close_category">← GO BACK</button>
        <h1 id="detail-title">TITLE</h1>
        <div id="detail-content">Content goes here...</div>
    </div>

    <script type="py">
        from pyscript import document
        import js

        # 1. Your Database: All your content lives here in Python
        categories = {
            "chess": {
                "title": "CHESS", 
                "color": "#FF3366", 
                "content": "<p>1545 FIDE Rating. Analyzing complex openings and playing strategic tournament games.</p>"
            },
            "basketball": {
                "title": "BASKETBALL", 
                "color": "#FF9933", 
                "content": "<p>6'0\" Center. Focusing on team coordination, defense, and high-pressure performance.</p>"
            },
            "coding": {
                "title": "CODING", 
                "color": "#33CCFF", 
                "content": "<p>Building automated Python scripts and stunning frontend designs directly on GitHub Pages.</p>"
            },
            "music": {
                "title": "MUSIC", 
                "color": "#CC33FF", 
                "content": "<p>Violin - Suzuki Book 3. Finding rhythm and discipline outside of academics.</p>"
            }
        }

        # 2. Logic: What happens when you click a column
        def open_category(event):
            # Find out which column was clicked by grabbing its ID
            clicked_id = event.currentTarget.id
            data = categories[clicked_id]
            
            # Hide the main screen and show the detail screen
            document.querySelector("#main-view").style.display = "none"
            detail_view = document.querySelector("#detail-view")
            detail_view.style.display = "block"
            
            # Dynamically change the background color to match the column
            detail_view.style.backgroundColor = data["color"]
            
            # Inject your Python data into the HTML
            document.querySelector("#detail-title").innerHTML = data["title"]
            document.querySelector("#detail-content").innerHTML = data["content"]
            
            # Instantly scroll the browser back to the top of the page
            js.window.scrollTo(0, 0)

        # 3. Logic: What happens when you click 'Go Back'
        def close_category(event):
            document.querySelector("#detail-view").style.display = "none"
            document.querySelector("#main-view").style.display = "block"
    </script>

    <script>
        const cursor = document.getElementById("custom-cursor");
        document.addEventListener("mousemove", (e) => {
            cursor.style.left = e.clientX + "px";
            cursor.style.top = e.clientY + "px";
        });
        
        // Makes the cursor slightly bigger when you hover over clickable things
        document.querySelectorAll("a, .column, .back-btn").forEach(el => {
            el.addEventListener("mouseenter", () => {
                cursor.style.width = "60px";
                cursor.style.height = "60px";
            });
            el.addEventListener("mouseleave", () => {
                cursor.style.width = "40px";
                cursor.style.height = "40px";
            });
        });
    </script>
</body>
</html>
