name: Build site

# Runs whenever you push a change to the files that feed the build
# (content, templates, styles, script, or the build script itself), on
# a schedule (to keep Chess.com ratings/games fresh even with no push),
# and on-demand from the Actions tab. It regenerates index.html and
# refreshes chess-data.json, committing both back for you.
on:
  push:
    branches: [main]
    paths:
      - "content.py"
      - "templates/**"
      - "assets/**"
      - "build.py"
      - "fetch_chess_data.py"
      - "render_certificates.py"
      - "certificates/**"
      - "requirements.txt"
  schedule:
    # Every 6 hours, so live ratings/games stay reasonably current.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Required so this workflow is allowed to commit the rebuilt files back
# to the repo. If this is missing, the build succeeds but the
# commit-back step fails — see the README for the one-time repo
# setting this depends on.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest Chess.com data
        run: python fetch_chess_data.py
        continue-on-error: true  # a Chess.com hiccup shouldn't block the site build

      - name: Render certificate PDFs to images
        run: python render_certificates.py

      - name: Build index.html
        run: python build.py

      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-build index.html + refresh chess data + render certificates [skip ci]"
          file_pattern: index.html chess-data.json certificates/*.jpg
